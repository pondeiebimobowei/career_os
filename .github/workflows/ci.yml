name: CareerOS Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Backlog, Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate YAML Backlog Schema & DAG
        run: pnpm backlog:validate

      - name: Typecheck Monorepo Workspace
        run: pnpm check-types

      - name: Lint Monorepo Workspace
        run: pnpm lint

      - name: Run Test Suites
        run: pnpm test

      - name: Build Monorepo Apps & Packages
        run: pnpm build
