name: Backlog Validation & Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Backlog CI Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate YAML Backlog
        run: pnpm backlog:validate

      - name: Run Backlog Engine Unit Tests
        run: pnpm --filter @repo/backlog-cli test
