          - Matching strategy implemented
          - Platform selection automated

  - id: EXT-ARCH-004
    title: Extraction Pipeline

    priority: P0

    estimate: L

    issues:

      - id: EXT-005
        title: Implement extraction pipeline

        type: task

        priority: P0

        estimate: L

