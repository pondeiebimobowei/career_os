  - id: EXT-ARCH-005
    title: Synchronization Engine

    priority: P0

    estimate: M

    issues:

      - id: EXT-006
        title: Implement sync queue

        type: task

        priority: P0

        estimate: M

        acceptance_criteria:
          - Queue persists offline
          - Retry logic implemented
